<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glosario 3D de soldadura</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #020509;
      }

      .fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        padding: 24px;
        color: #f4f1e8;
        background: #020509;
        text-align: center;
      }

      .fallback h1,
      .fallback p {
        margin: 0;
      }

      a-scene {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <main class="fallback">
      <h1>Glosario 3D de soldadura</h1>
      <p>Entra en VR desde el botón del visor o selecciona los términos con el ratón.</p>
    </main>

    <a-scene
      background="color: #020509"
      cursor="rayOrigin: mouse"
      raycaster="objects: .term-hitbox"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      xr-mode-ui="enabled: true"
      vr-mode-ui="enabled: true"
    >
      <a-entity id="term-cloud"></a-entity>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls wasd-controls>
          <a-entity
            cursor="fuse: false; rayOrigin: entity"
            raycaster="objects: .term-hitbox"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.014"
            material="color: #ffd24a; shader: flat"
          ></a-entity>
        </a-camera>

        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .term-hitbox; far: 6"
          line="color: #ffd24a; opacity: 0.75"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .term-hitbox; far: 6"
          line="color: #ffd24a; opacity: 0.75"
        ></a-entity>
      </a-entity>

      <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
      <a-entity
        light="type: point; color: #ffd24a; intensity: 1.1; distance: 5"
        position="0 2 0"
      ></a-entity>

      <a-sky color="#020509"></a-sky>
      <a-ring
        position="0 0.02 0"
        rotation="-90 0 0"
        radius-inner="1.98"
        radius-outer="2.02"
        material="color: #ffd24a; shader: flat; opacity: 0.25; transparent: true"
      ></a-ring>
    </a-scene>

    <script>
      const glossary = [
        { term: "ZAT" },
        { term: "DC" },
        { term: "AC" },
        { term: "E6013" },
        { term: "Arco eléctrico" },
        { term: "Baño de fusión" },
        { term: "Cordón" },
        { term: "Escoria" },
        { term: "Electrodo" },
        { term: "Revestimiento" },
        { term: "Polaridad" },
        { term: "Penetración" },
        { term: "Masa" },
        { term: "Piqueta" },
        { term: "WPS" },
        { term: "Polaridad directa DC-" },
        { term: "Polaridad inversa DC+" },
        { term: "Plasma" },
        { term: "Ionización" },
        { term: "Intensidad de corriente" },
        { term: "Tensión" },
        { term: "Higroscópico" },
        { term: "E7016" },
        { term: "E7018" },
        { term: "E7024" },
      ];

      const ORBIT_RADIUS = 2;
      const termRoot = document.querySelector("#term-cloud");
      let activeCard = null;

      AFRAME.registerComponent("look-at-camera", {
        tick() {
          const camera = document.querySelector("[camera]");
          if (!camera) return;
          this.el.object3D.lookAt(camera.object3D.position);
        },
      });

      AFRAME.registerComponent("orbit-term", {
        schema: {
          angle: { type: "number", default: 0 },
          radius: { type: "number", default: ORBIT_RADIUS },
          speed: { type: "number", default: 0.05 },
          height: { type: "number", default: 1.6 },
          wave: { type: "number", default: 0.08 },
        },
        tick(time, delta) {
          const elapsed = time / 1000;
          this.data.angle += (delta / 1000) * this.data.speed;

          const x = Math.cos(this.data.angle) * this.data.radius;
          const z = Math.sin(this.data.angle) * this.data.radius;
          const y = this.data.height + Math.sin(elapsed * 0.8 + this.data.angle) * this.data.wave;

          this.el.setAttribute("position", `${x} ${y} ${z}`);
        },
      });

      function createTermEntity(item, index) {
        const slug = slugify(item.term);
        const textureUrl = `assets/terms/termino_${slug}.png`;
        const angle = (Math.PI * 2 * index) / glossary.length;
        const height = 1.0 + (index % 5) * 0.32;
        const speed = 0.035 + (index % 4) * 0.008;

        const entity = document.createElement("a-entity");
        entity.setAttribute("look-at-camera", "");
        entity.setAttribute(
          "orbit-term",
          `angle: ${angle}; radius: ${ORBIT_RADIUS}; speed: ${speed}; height: ${height}; wave: 0.07`
        );

        const plane = document.createElement("a-plane");
        const isLongTerm = item.term.length > 16;
        plane.classList.add("term-hitbox");
        plane.setAttribute("width", isLongTerm ? "1.35" : "0.95");
        plane.setAttribute("height", isLongTerm ? "0.34" : "0.24");
        plane.setAttribute(
          "material",
          `src: url(${textureUrl}); transparent: true; shader: flat; color: #f4f1e8`
        );
        plane.setAttribute(
          "animation__hover",
          "property: scale; startEvents: mouseenter; to: 1.14 1.14 1; dur: 120"
        );
        plane.setAttribute(
          "animation__leave",
          "property: scale; startEvents: mouseleave; to: 1 1 1; dur: 120"
        );

        plane.addEventListener("mouseenter", () => {
          plane.setAttribute(
            "material",
            `src: url(${textureUrl}); transparent: true; shader: flat; color: #ffd24a`
          );
        });
        plane.addEventListener("mouseleave", () => {
          plane.setAttribute(
            "material",
            `src: url(${textureUrl}); transparent: true; shader: flat; color: #f4f1e8`
          );
        });
        plane.addEventListener("click", () => showInfoCard(item, entity));

        entity.appendChild(plane);
        termRoot.appendChild(entity);
      }

      function showInfoCard(item, termEntity) {
        if (activeCard) {
          activeCard.remove();
        }

        const slug = slugify(item.term);
        const textureUrl = `assets/cards/${slug}.png`;

        const card = document.createElement("a-entity");
        card.setAttribute("position", "1.08 0.02 0");
        card.setAttribute("scale", "0.01 0.01 0.01");
        card.setAttribute("animation", "property: scale; to: 1 1 1; dur: 180; easing: easeOutCubic");

        const panel = document.createElement("a-plane");
        panel.setAttribute("width", "1.65");
        panel.setAttribute("height", "0.99");
        panel.setAttribute(
          "material",
          `src: url(${textureUrl}); transparent: true; shader: flat; side: double`
        );

        card.appendChild(panel);
        termEntity.appendChild(card);
        activeCard = card;
      }

      function slugify(text) {
        return text
          .toLowerCase()
          .trim()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replaceAll("+", "plus")
          .replaceAll("-", "minus")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
      }

      glossary.forEach(createTermEntity);
    </script>
  </body>
</html>
